server:
  port: 8040
spring:
  application:
    name: notification-service
  data:
    mongodb:
      host: localhost
      port: 27017
      database: notifications
      username: root
      password: example
      #    uri: mongodb://root:example@localhost:27017/notifications?authSource=admin
      authentication-database: admin

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: runEvents
notifications:
  kafka:
    topic: midnight.ranking.notification
eureka:
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
springdoc:
  api-docs:
    path: /notification-service/v3/api-docs
  swagger-ui:
    path: /notification-service/swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: "*"
logging:
  level:
    com.runner.notification: DEBUG
    org:
      springframework:
        data:
          mongodb: DEBUG
          core:
            MongoTemplate: DEBUG