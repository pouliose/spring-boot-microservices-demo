server:
  port: 8090
spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: run-service
          uri: lb://run-service
          predicates:
            - Path=/api/v1/runs/**
        - id: run-service-swagger
          uri: lb://run-service
          predicates:
            - Path=/run-service/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: user-service-swagger
          uri: lb://user-service
          predicates:
            - Path=/user-service/**
        - id: statistics-service
          uri: lb://statistics-service
          predicates:
            - Path=/api/v1/statistics/**
        - id: statistics-service-swagger
          uri: lb://statistics-service
          predicates:
            - Path=/statistics-service/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
        - id: notification-service-swagger
          uri: lb://notification-service
          predicates:
            - Path=/notification-service/**
    loadbalancer:
      ribbon:
        enabled: false
      retry:
        enabled: true
    profiles:
      active: default
      gateway:
        discovery:
          locator:
            enabled: true
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
logging:
  level:
    root: DEBUG
    org.springframework.cloud.gateway: DEBUG