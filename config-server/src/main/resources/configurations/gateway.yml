server:
  port: 8090
spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: run-service
          uri: http://localhost:8060
          predicates:
            - Path=/api/v1/runs/**
        - id: run-service-swagger
          uri: http://localhost:8060
          predicates:
            - Path=/run-service/**
        - id: user-service
          uri: http://localhost:8070
          predicates:
            - Path=/api/v1/users/**
        - id: user-service-swagger
          uri: http://localhost:8070
          predicates:
            - Path=/user-service/**
        - id: statistics-service
          uri: http://localhost:8050
          predicates:
            - Path=/api/v1/statistics/**
        - id: statistics-service-swagger
          uri: http://localhost:8050
          predicates:
            - Path=/statistics-service/**
        - id: notification-service
          uri: http://localhost:8040
          predicates:
            - Path=/api/v1/notifications/**
        - id: notification-service-swagger
          uri: http://localhost:8040
          predicates:
            - Path=/notification-service/**
springdoc:
  api-docs:
    path: /gateway/v3/api-docs
  swagger-ui:
    path: /gateway/swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
logging:
  level:
    root: DEBUG
    org.springframework.cloud.gateway: DEBUG